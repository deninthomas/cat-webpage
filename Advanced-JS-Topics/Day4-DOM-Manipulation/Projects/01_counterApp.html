<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App - DOM Manipulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #counter-display {
            font-size: 64px;
            font-weight: bold;
            color: black;
            margin: 30px 0;
            transition: color 0.3s;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
            min-width: 100px;
        }

        #increase {
            background-color: #4CAF50;
            color: white;
        }

        #increase:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #decrease {
            background-color: #f44336;
            color: white;
        }

        #decrease:hover {
            background-color: #da190b;
            transform: scale(1.05);
        }

        #reset {
            background-color: #2196F3;
            color: white;
        }

        #reset:hover {
            background-color: #0b7dda;
            transform: scale(1.05);
        }

        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Counter App</h1>
        <div id="counter-display">0</div>
        
        <div class="button-group">
            <button id="increase">➕ Increase</button>
            <button id="decrease">➖ Decrease</button>
            <button id="reset">🔄 Reset</button>
        </div>

        <div class="info">
            <p><strong>Color Code:</strong></p>
            <p>🟢 Green = Positive</p>
            <p>⚫ Black = Zero</p>
            <p>🔴 Red = Negative</p>
        </div>
    </div>

    <script src="01_counterApp.js"></script>
</body>
</html>
